specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: H.B. Fuller Company
providerId: h-b-fuller
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Adhesives
  - Sealants
  - Chemical
description: H.B. Fuller is a Fortune 1000 industrial adhesives manufacturer. Its API surface is
  intended for enterprise customers and channel partners rather than the general developer market.
  No public pricing page or self-service plan catalog is published; access is granted under bilateral
  partner / customer agreements.
notes: No public pricing is available. The single placeholder Enterprise plan represents the
  expected commercial shape; reconcile against the partner agreement.
sources:
  - https://www.hbfuller.com/
plans:
  - id: h-b-fuller-enterprise
    name: Enterprise / Partner
    type: enterprise
    description: Bilateral enterprise / partner integration agreement; volumes and entitlements are
      contract-defined.
    entries:
      - label: Plan price
        description: Custom-quoted via the partner agreement
        name: plan_price
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: configurable
        domains:
          - https://api.hbfuller.com
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: API Requests
        description: Negotiated request volume
        name: api_requests
        type: quota
        metric: requests
        limit: contract-defined
        timeFrame: month
        geo: configurable
        domains:
          - https://api.hbfuller.com
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Partner Account Manager
      - name: Contractual SLA
      - name: H.B. Fuller Company API
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

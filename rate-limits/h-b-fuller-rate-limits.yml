specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: H.B. Fuller Company
providerId: h-b-fuller
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Adhesives
  - Sealants
  - Chemical
  - Rate Limiting
  - Quotas
  - Throttling
description: H.B. Fuller does not publish public API rate limits. Throttling behavior is governed
  by the partner agreement and the gateway in front of api.hbfuller.com.
notes: No public rate-limit documentation could be located. Numbers below are contract-defined,
  not numeric defaults.
sources:
  - https://www.hbfuller.com/
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - tier: enterprise
    name: Contract-defined per-partner limit
    scope: partner
    metric: varies
    limit: see partner agreement
    applies:
      - H.B. Fuller Company API
policies:
  - name: Backoff Strategy
    description: Honor Retry-After on 429 responses; back off with exponential jitter on transient
      5xx.
  - name: Partner Scoping
    description: Limits are enforced per partner credential; contact the partner manager for raises.
  - name: Fair Use
    description: Sustained traffic above contracted volumes may be throttled regardless of partner
      tier.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

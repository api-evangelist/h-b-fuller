specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: H.B. Fuller Company
providerId: h-b-fuller
publisherName: H.B. Fuller Company
serviceCategory: Industrial / Manufacturer Partner API
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Adhesives
  - Sealants
  - Chemical
  - FinOps
  - Cost Management
  - FOCUS
description: 'FOCUS-aligned FinOps placeholder for H.B. Fuller: enterprise / partner API access
  bundled into a commercial agreement, not metered as a standalone SaaS line. Meters describe
  partner-integration volume rather than billable units.'
notes: No public commercial model is published. The shape below treats API consumption as a
  partner-allocation surface; replace meters when a billable model is documented.
sources:
  - https://www.hbfuller.com/
principles:
  - name: Visibility
    description: Track partner-integration volume via the H.B. Fuller partner gateway logs and
      reconcile against the partner agreement.
  - name: Allocation
    description: Allocate integration cost across business units (packaging, hygiene, engineering
      adhesives, construction) using the calling partner system.
  - name: Optimization
    description: Cache product / SDS / availability lookups; batch order-status polls; consolidate
      partner integrations through a single gateway.
  - name: Accountability
    description: Assign a partner-program owner; review API usage quarterly against contract terms.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: H.B. Fuller Company API
  ServiceCategory: Industrial / Manufacturer Partner API
  ProviderName: H.B. Fuller Company
  PublisherName: H.B. Fuller Company
  InvoiceIssuerName: H.B. Fuller Company
  PricingCategory: Subscription
  PricingUnit: partner-agreement
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: api_requests
    description: Partner-integration request volume (allocation meter)
    unit: request
    aggregation: sum
    dimensions:
      - partner
      - endpoint
      - business_unit
  - name: orders_submitted
    description: Order-related transactions submitted via the API
    unit: order
    aggregation: sum
    dimensions:
      - partner
      - product_line
apis:
  - name: H.B. Fuller Company API
    baseURL: https://api.hbfuller.com
    tags:
      - Adhesives
      - Sealants
      - Chemical
    serviceName: H.B. Fuller Company API
    serviceCategory: API
unitEconomics:
  - name: Cost per Partner Integration
    metric: billed_cost / active_partners
    target: TBD
  - name: Cost per Order Transaction
    metric: billed_cost / orders_submitted
    target: TBD
maintainers:
